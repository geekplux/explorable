<!doctype html>
<!-- The 1280×640 social preview card. Rendered by scripts/social-image.mjs, which
     serves this file next to the app preview (for /fonts/*) and supplies
     figure.png, a still of the home page's live figure taken in the same run.
     Type and lines are the site's at 2×: 64/40/28/24 for 32/20/14/12, 1px for 0.5px. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explorable social preview</title>
<style>
@font-face{font-family:"Explorable Serif";src:url(/fonts/serif-latin.woff2) format("woff2");font-weight:400 600}
@font-face{font-family:Geist;src:url(/fonts/geist-latin.woff2) format("woff2");font-weight:400 600}
@font-face{font-family:"Geist Mono";src:url(/fonts/geist-mono-latin.woff2) format("woff2");font-weight:400 500}
/* Radix Colors sand, light: 1 page, 6 hairline, 11 secondary text, 12 text. */
:root{--sand-1:#fdfdfc;--sand-6:#dad9d6;--sand-11:#63635e;--sand-12:#21201c}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:640px;overflow:hidden}
body{background:var(--sand-1);color:var(--sand-12);font-family:"Explorable Serif",Georgia,serif;display:grid;grid-template-columns:560px 1fr;grid-template-rows:1fr auto;column-gap:64px;padding:64px 80px 0}
.text{align-self:center}
.wordmark{display:flex;align-items:center;gap:20px;font:600 40px/1 "Explorable Serif",Georgia,serif}
.wordmark svg{width:80px;height:56px;flex:none}
h1{margin-top:48px;font-weight:600;font-size:64px;line-height:1.15;letter-spacing:-.015em}
.lede{margin-top:28px;font-size:28px;line-height:1.5;color:var(--sand-11)}
.still{align-self:center}
.still img{display:block;width:100%;height:auto}
.foot{grid-column:1/-1;display:flex;justify-content:space-between;margin-top:40px;padding:24px 0 32px;border-top:1px solid var(--sand-6);font:400 24px/1 "Geist Mono",ui-monospace,monospace;color:var(--sand-11)}
</style>
</head>
<body>
<div class="text">
  <p class="wordmark"><svg viewBox="3 10 58 41" aria-hidden="true"><defs><radialGradient id="g" cx="44" cy="38" r="40" gradientUnits="userSpaceOnUse"><stop offset=".05" stop-color="#ff8b3e"/><stop offset=".3" stop-color="#e54666"/><stop offset=".55" stop-color="#8e4ec6"/><stop offset=".95" stop-color="#3e63dd"/></radialGradient><radialGradient id="h" cx="44" cy="38" r="7" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffc53d" stop-opacity=".55"/><stop offset="1" stop-color="#ffc53d" stop-opacity="0"/></radialGradient></defs><path d="M6 16H58V48H6ZM38 16V48M38 36H58M46 36V48M38 40H46M42 36V40" fill="none" stroke="#b9bbc6" stroke-width=".5"/><g fill="#b9bbc6"><circle cx="38" cy="48" r=".9"/><circle cx="38" cy="36" r=".9"/><circle cx="46" cy="36" r=".9"/><circle cx="46" cy="40" r=".9"/></g><path d="M6.17 48C6.39 46.08 8.21 42.12 9.97 39.12C11.5 36.52 13.08 34.25 14.78 31.64C19.86 23.83 28.42 18.94 38 18.6C47.86 18.25 56.05 26.13 56.38 36C56.58 41.88 51.88 46.75 46 46.93C42.08 47.06 38.84 43.92 38.72 40C38.67 38.15 40.15 36.62 42 36.57C42.79 36.54 43.48 37.17 43.5 38L44.5 38C44.5 36.56 43.36 35.46 42 35.43C39.5 35.38 37.34 37.37 37.28 40C37.16 44.78 40.97 48.94 46 49.07C53.36 49.26 59.42 43.36 59.62 36C59.95 24.12 50.51 13.77 38 13.4C24.42 13.01 14.33 20.26 8.9 27.5C6.83 30.26 5.46 33.7 5.02 37.55C4.78 39.62 4.85 41.46 4.99 42.9C5.27 45.78 5.71 46.97 5.83 48Z" fill="url(#g)"/><circle cx="44" cy="38" r="7" fill="url(#h)"/><circle cx="44" cy="38" r="2.6" fill="#ffc53d"/></svg>Explorable</p>
  <h1>Hard ideas, made clear with figures you can drag.</h1>
  <p class="lede">Paste a link to a paper or a blog post. Get a short read in plain words about its one big idea.</p>
</div>
<div class="still"><img src="figure.png" alt="The attention figure mid-drag: a low temperature sharpens six bars into one tall bar on “cat”."></div>
<p class="foot"><span>explorable.geekplux.com</span><span>Open source, MIT</span></p>
</body>
</html>
